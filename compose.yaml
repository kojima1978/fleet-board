services:
  app:
    container_name: fleetflow-development-app
    build:
      context: .
      target: development
    command: sh -c "sh scripts/development/prepare-db.sh && npm run dev"
    environment:
      DATABASE_URL: postgresql://fleet:fleet@db:5432/fleet?schema=public
      WATCHPACK_POLLING: "true"
      FLEETFLOW_DEV_BIND_ADDRESS: ${FLEETFLOW_DEV_BIND_ADDRESS:-127.0.0.1}
      # Windows用起動コマンドが、このPCの現在のLAN IPを毎回取得して渡す。
      FLEETFLOW_DEV_ALLOWED_ORIGINS: ${FLEETFLOW_DEV_ALLOWED_ORIGINS:-}
      # コンテナー内のホスト名はコンテナーIDになるため、WindowsのPC名を渡す。
      FLEETFLOW_DEV_HOST_NAME: ${COMPUTERNAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      # LAN IPへ公開しても、サーバー自身のlocalhostからは開けるようにする。
      # 既定設定（127.0.0.1）では同じ公開先が重なるが、Composeが1つにまとめる。
      - "127.0.0.1:3035:3000"
      - "${FLEETFLOW_DEV_BIND_ADDRESS:-127.0.0.1}:3035:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  db:
    container_name: fleetflow-development-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-backup:
    container_name: fleetflow-development-db-backup
    image: postgres:17-alpine
    command: sh /scripts/database/backup-db.sh loop
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      PGPASSWORD: fleet
      AUTO_VERIFY_BACKUP: "true"
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name 'fleet-*.sql.gz' -mmin -1560 | grep -q . && find /backups/.last-verified -mmin -1560 | grep -q ."]
      interval: 30m
      timeout: 5s
      retries: 2
      start_period: 2m

  nfc-bridge-build:
    container_name: fleetflow-nfc-bridge-builder
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /src
    command: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o /out
    volumes:
      - ./nfc-bridge:/src
      - ./nfc-bridge/dist:/out

volumes:
  postgres_data:
  node_modules:
  next_cache:
