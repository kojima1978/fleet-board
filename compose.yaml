services:
  app:
    build:
      context: .
      target: development
    command: sh -c "npm run db:generate && npm run db:push && npm run db:seed && npm run dev"
    environment:
      DATABASE_URL: postgresql://fleet:fleet@db:5432/fleet?schema=public
      WATCHPACK_POLLING: "true"
    ports:
      - "3035:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    init: true

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  node_modules:
  next_cache:
