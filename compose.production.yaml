name: fleetflow-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: fleetflow-production-app:current
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgresql://fleet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/fleet?schema=public
      FLEETFLOW_ADMIN_PIN: ${FLEETFLOW_ADMIN_PIN:?FLEETFLOW_ADMIN_PIN is required}
      FLEETFLOW_SESSION_SECRET: ${FLEETFLOW_SESSION_SECRET:?FLEETFLOW_SESSION_SECRET is required}
      FLEETFLOW_APP_VERSION: ${FLEETFLOW_APP_VERSION:-0.1.0}
      FLEETFLOW_DEPLOYED_AT: ${FLEETFLOW_DEPLOYED_AT:-unknown}
      FLEETFLOW_COOKIE_SECURE: ${FLEETFLOW_COOKIE_SECURE:-false}
      FLEETFLOW_TRUST_PROXY: ${FLEETFLOW_TRUST_PROXY:-false}
    ports:
      - "${FLEETFLOW_BIND_ADDRESS:-127.0.0.1}:${FLEETFLOW_PORT:-3035}:3000"
    volumes:
      - ./backups/production:/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  migrate:
    image: fleetflow-production-migrate:current
    build:
      context: .
      target: builder
    command: sh scripts/production/prepare-db.sh
    environment:
      DATABASE_URL: postgresql://fleet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/fleet?schema=public
      FLEETFLOW_ADMIN_PIN: ${FLEETFLOW_ADMIN_PIN:?FLEETFLOW_ADMIN_PIN is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./backups/production:/backups
      - ./scripts:/scripts:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  db-backup:
    image: postgres:17-alpine
    command: sh /scripts/database/backup-db.sh loop
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTO_VERIFY_BACKUP: "true"
    volumes:
      - ./backups/production:/backups
      - ./scripts:/scripts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name 'fleet-*.sql.gz' -mmin -1560 | grep -q . && find /backups/.last-verified -mmin -1560 | grep -q ."]
      interval: 30m
      timeout: 5s
      retries: 2
      start_period: 2m

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_production_data:
